<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_name">Local AI Subtitles Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="videoContainer">
      <video id="videoPlayer" controls></video>

      <div id="subtitleOverlay">
        <div id="subtitleTrack"></div>
      </div>

      <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <p id="loadingText" data-i18n="hint_drag_to_player">Drag a video file here or use the side panel</p>
      </div>
    </div>

    <div id="controls">
      <div class="control-group">
        <label for="playerSourceLang" data-i18n="label_source_lang">Source Language</label>
        <select id="playerSourceLang"></select>
      </div>
      <div class="control-group">
        <label for="playerTargetLang" data-i18n="label_target_lang">Target Language</label>
        <select id="playerTargetLang"></select>
      </div>
      <button id="fullscreenBtn" class="ctrl-btn" title="Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
